name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts (forge build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (for node_modules/@openzeppelin remapping)
        run: bun install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build contracts
        run: forge build

      - name: Test contracts
        run: forge test -vv

  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Foundry (for forge test in check script)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Typecheck + Lint + Unit tests + Forge tests
        run: bun run check

      - name: Build
        run: bun run build
        env:
          VITE_NETWORK: "testnet"
          VITE_ROUTER_ADDRESS: "0x6216af3fb64d039b87088f78da38bd641d62b426"
          # Use the real secret when set; fall back to a placeholder so CI build
          # succeeds even without the secret configured (Privy only runs in-browser).
          VITE_PRIVY_APP_ID: ${{ secrets.VITE_PRIVY_APP_ID || 'ci-placeholder' }}
