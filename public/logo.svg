<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Settl — Instant USDC Payments, Built on Arc">
  <!-- Cream background -->
  <rect width="960" height="540" fill="#f0ede6"/>

  <!-- Open circle icon (centered around x=290, y=270) -->
  <!-- Nearly complete circle, gap at top-right, thick stroke -->
  <circle cx="290" cy="270" r="72" stroke="#111111" stroke-width="14" stroke-linecap="round"
    stroke-dasharray="405 55" stroke-dashoffset="-10"/>

  <!-- Green dot at midpoint of gap -->
  <circle cx="341" cy="219" r="15" fill="#22c55e"/>

  <!-- Wordmark "settl" -->
  <text x="390" y="308"
    font-family="'DM Sans','Inter','Space Grotesk',system-ui,sans-serif"
    font-weight="800"
    font-size="128"
    letter-spacing="-4"
    fill="#111111">settl</text>

  <!-- Tagline -->
  <text x="480" y="390"
    font-family="'DM Sans','Inter',system-ui,sans-serif"
    font-weight="400"
    font-size="18"
    letter-spacing="5"
    fill="#888880"
    text-anchor="middle">INSTANT USDC PAYMENTS, BUILT ON ARC</text>
</svg>
